<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат — лабораторна №1</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="/chat.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Чат</h1>
      <p id="status" role="status">Підключення…</p>
    </header>

    <section id="messages" role="log" aria-label="Повідомлення" tabindex="0">
      <p id="empty">Тут з’являться повідомлення.</p>
    </section>

    <form id="chat">
      <label for="author">Ваше ім’я</label>
      <input id="author" name="author" maxlength="40" autocomplete="nickname" required>

      <label for="message">Повідомлення</label>
      <div class="composer">
        <input id="message" name="message" maxlength="500" autocomplete="off" required>
        <button disabled>Надіслати</button>
      </div>
    </form>
  </main>
</body>
</html>
